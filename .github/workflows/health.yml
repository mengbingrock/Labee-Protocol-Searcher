name: Backend health

# Probes every third-party backend and commits the measured result into the
# README's health block. Runs daily because the failure mode this catches is a
# provider changing behaviour on its own schedule, not a change to this repo.
#
# Every run is also appended to health-history.jsonl and refreshes the exact DOI
# observations in fetchability-index.json. The history separates "this broke
# last night" from "this has been down for two weeks"; the DOI index keeps
# search from treating a journal-wide prior as a per-paper fact.

on:
  schedule:
    # 05:17 UTC — off the hour, since the top of the hour is when everyone
    # else's cron jobs hit the same public APIs.
    - cron: "17 5 * * *"
  workflow_dispatch:

# Never let two runs race on the same commit.
concurrency:
  group: backend-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # The probes drive dist/index.mjs, so the bundle has to exist first.
      - run: npm run build

      - name: Probe backends and update README
        env:
          # Optional. Absent keys are reported as "not configured" rather than
          # as outages, so a fork without secrets still gets a truthful table.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          # Required by the Unpaywall tier of `fetch` (it's the `email=` param).
          PROTOCOLS_CONTACT_EMAIL: ${{ vars.PROTOCOLS_CONTACT_EMAIL }}
        run: >-
          node scripts/health-check.mjs --write
          --json-out health-report.json
          --fetchability-out fetchability-index.json

      # The full per-source and per-DOI detail of a single run, kept for 90 days. The
      # committed history file holds the summary of every run forever; this
      # artifact is the place to go for the exact errors behind one bad day.
      - name: Upload raw report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            health-report.json
            fetchability-index.json
          retention-days: 90

      # The block carries a "last run" stamp and the history file gains a line,
      # so a healthy day still produces a diff. That's deliberate: the point is
      # provable freshness, and a record that only moved on a failure would read
      # as stale exactly when everything is fine.
      - name: Commit the refreshed block and history
        run: |
          if git diff --quiet -- README.md health-history.jsonl fetchability-index.json; then
            echo "No change to health outputs — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md health-history.jsonl fetchability-index.json
          # [skip ci] so the daily doc commit doesn't re-trigger the test workflow.
          git commit -m "chore: daily backend health check $(date -u +%Y-%m-%d) [skip ci]"
          # A concurrent push (another workflow, a merge) would otherwise fail
          # the job and silently drop the day's record.
          git pull --rebase --autostash
          git push
